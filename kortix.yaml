# yaml-language-server: $schema=https://kortix.com/schema/kortix.v3.schema.json
#
# A deny-by-default Kortix project, on the v3 manifest.
#
# Three specialist agents, each granted only what its job needs, plus the
# project-wide approval policy. Read this file with the agent files beside it:
# in v3 behavior (prompt, model, mode, permission) is a key on the agent's block
# here, `prompt_file` names the file that holds the prompt alone, and governance
# (connectors, secrets, apps, kortix_permissions, skills, tools) is on the same
# block.
#
# Grants are deny-by-default: an agent with no connectors, secrets, apps or
# kortix_permissions key gets none of them. Two keys differ, and both are named
# explicitly below for every agent:
#   - an omitted `tools` key grants every tool
#   - an omitted `skills` key grants no skill
kortix_version: 3

default_agent: ops-readout

project:
  name: agentic-os-starter
  description: A minimal governed Kortix project, for a security review of an agentic operating system.

env:
  required: []
  optional: [HELPDESK_API_KEY, REPORT_SLACK_WEBHOOK]

# Every Kortix tool is registered in v3, and a registry entry gives no agent
# anything. Each agent below narrows what it may call with its own `tools:` grant.

agents:
  # Reporting agent: reads two connectors, writes a file, runs on a schedule.
  ops-readout:
    description: "Builds the Monday readout: reads billing and warehouse connectors, returns one spreadsheet with the variance called out. Runs on a Sunday-night trigger."
    mode: primary
    prompt_file: agents/ops-readout.md
    permission: allow
    steps: 40
    connectors: [billing, warehouse]
    secrets: [REPORT_SLACK_WEBHOOK]
    skills: [kortix-cli]
    kortix_permissions:
      - project.session.read
      - project.file.read
      - project.file.write
      - project.review.submit
    tools: [read, write, web_search, memory, show]

  # Triage agent: one connector, and its write action waits for a person.
  support-triage:
    description: "Reads overnight support tickets, groups them by cause, drafts the replies it can support and holds the rest for a person. One connector, no writes."
    mode: primary
    prompt_file: agents/support-triage.md
    permission:
      bash: ask
      edit: deny
    connectors: [helpdesk]
    secrets: [HELPDESK_API_KEY]
    skills: [kortix-cli]
    kortix_permissions:
      - project.session.read
      - project.review.submit
    tools: [read, grep, web_search, scrape_webpage, memory]

  # Read-only agent: no connectors, no secrets, no merge, no writes.
  release-check:
    description: "Read-only pre-release check: confirms the manifest validates, lists every grant in the project and compares it with the previous release. No connectors, no secrets, no writes."
    mode: primary
    prompt_file: agents/release-check.md
    permission:
      edit: deny
      bash:
        "*": deny
        "kortix validate*": allow
        "kortix agents ls*": allow
        "kortix connectors policy ls*": allow
        "python3 scripts/check_grants.py*": allow
        "git diff *": allow
        "git log *": allow
    connectors: none
    secrets: none
    kortix_permissions:
      - project.session.read
      - project.gitops.read
    tools: [read, grep, list, bash]

# Project-wide policy. The default mode is allow_all, which runs every action
# a grant allows; `risk` runs reads and holds writes and destructive calls for
# a person. Set it to risk in any project whose agents touch money, mail,
# tickets or production, then narrow the few actions that must run unattended
# with an explicit rule.
policy:
  default_mode: risk

# A held call expires after 24 hours by default; this project shortens the
# window to four hours. An unattended job never waits on an approval: give it
# an always_run rule for the exact action instead.
approvals:
  ttl: 4h

# Project-wide rules win over a connector's own rules and over its sensitive
# flag. Patterns are fully qualified. `always_run` is Allow, `require_approval`
# is Ask, `block` is Block.
policies:
  # Reads never wait, in any connector.
  - match: "*.*get*"
    action: always_run
  - match: "*.*list*"
    action: always_run
  - match: "*.*search*"
    action: always_run
  # Money moving back out needs a person, whatever the connector says.
  - match: "*.*refund*"
    action: require_approval
  - match: "*.*payment*"
    action: require_approval
  # Deleting a record is a decision, not a step.
  - match: "*.*delete*"
    action: block
